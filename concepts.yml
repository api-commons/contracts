context: contracts
name: Contract Lifecycle
intro: >-
  The common contract-lifecycle vocabulary -- the contracts a business holds, the clauses in
  them, the obligations they create and the templates they are drafted from -- distilled from
  the APIs that already exist. Signing belongs to the e-signature context.
tags: [Contract Management, CLM, Contract Lifecycle Management, Contract Intelligence, Legal Tech, Contract Analytics]

envelope: [_links, _pagination, _results, data, success, errors, warnings, count, total, page, meta, links,
           value, results, next, previous, has_more, message, status_code, ids, next_page, previous_page,
           page_info, cursor, total_count, per_page, total_pages, current_page, object, url]

common_fields:
  id: [uuid, guid, object_id, record_id, contract_id, agreement_id]
  created_at: [created, created_date, date_created, create_time, creation_date, created_on]
  updated_at: [updated, updated_date, modified_at, last_modified, date_modified, update_time, modified_date, modified]
  metadata: [meta_data, custom_fields, custom, attributes, properties, fields, tags]
  status: [state, contract_status, stage, lifecycle_stage, workflow_status]
  name: [title, display_name, label, contract_name]
  description: [notes, note, details, summary]

concepts:
  contract:
    segments: [contracts, contract, agreements, agreement, records@clm|contracts]
    aliases:
      counterparty: [counterparty_name, parties, party, vendor, customer, counterparties, other_party]
      type: [contract_type, agreement_type, category, document_type]
      effective_date: [start_date, effective_on, commencement_date, start]
      expiration_date: [end_date, expires_at, expiry_date, termination_date, end]
      renewal_date: [auto_renewal_date, renewal, renews_at, notice_date]
      value: [contract_value, amount, total_value, tcv, acv]
      owner_id: [owner, created_by, requester, assignee]
  # clause and obligation were measured and dropped: 3 providers each, with no shared property
  # beyond an id.
  contract_template:
    requires: [contract]
    path: /contract-templates
    segments: [templates, template, contract_templates, contract-templates]
    aliases:
      type: [template_type, contract_type, category]

exclude:
  contract:
    docusign: /clickwraps/{id}/agreements are clickwrap acceptance records
findings:
  - "A contract agrees only on id, name, status and created_at. Counterparty, value, effective and
    expiration dates -- the facts a contract system exists to track -- are each carried by a
    minority under different names."
  - "Contract lifecycle publishes little (45 providers, 11 mapped), and the analysis that sets CLM
    apart -- clauses, obligations -- is almost never a resource of its own."
decisions:
  - "Signing is e-signature's: envelopes and recipients are not duplicated. Agreements count as
    contracts here unless they are clickwrap acceptance records."
  - "Templates are `/contract-templates`: e-signature owns `/templates`."
  - "Clauses and obligations were measured and dropped."
